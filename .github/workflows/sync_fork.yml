name: Fork Sync

permissions:
  contents: write

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  sync_with_upstream:
    name: Sync with Upstream
    runs-on: ubuntu-latest
    if: ${{ github.event.repository.fork }}

    steps:
      - name: Checkout target repo
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Configure Git user
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Add upstream repository
        run: |
          git remote add upstream https://github.com/huangxd-/danmu_api.git || true
          git remote -v

      - name: Fetch upstream
        run: |
          git fetch upstream main

      - name: Sync main branch
        run: |
          git checkout main
          git merge upstream/main --no-edit
          git push origin main

      - name: Check for new commits
        if: success()
        run: echo "Sync completed successfully"

      - name: Check for Failure
        if: failure()
        run: |
          echo "[Error] Sync failed. This might be due to:"
          echo "1. Merge conflicts that need manual resolution"
          echo "2. Network issues"
          echo "3. Permission issues"
          echo "Please check the logs and consider manual sync if needed."
          exit 1
